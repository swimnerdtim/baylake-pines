<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baylake Pines Country Club - Neighborhood Disc Golf Course</title>
    <meta name="description" content="A neighborhood disc golf course in Baylake Pines. Featuring The Washington Memorial and 9 holes winding through our lakefront community." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://baylakepinescc.com/" />
    <meta property="og:title" content="Baylake Pines Country Club" />
    <meta property="og:description" content="A neighborhood disc golf course featuring The Washington Memorial and 9 holes winding through our lakefront community." />
    <meta property="og:image" content="https://baylakepinescc.com/aerial.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://baylakepinescc.com/" />
    <meta property="twitter:title" content="Baylake Pines Country Club" />
    <meta property="twitter:description" content="A neighborhood disc golf course featuring The Washington Memorial and 9 holes winding through our lakefront community." />
    <meta property="twitter:image" content="https://baylakepinescc.com/aerial.jpg" />
    
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
